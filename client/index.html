<!doctype html>
<html>
  <head>
    <title>Music App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>🎵 My Music App</h2>

    <input
      type="text"
      id="searchInput"
      placeholder="Search songs..."
      style="padding: 10px; width: 250px; margin: 10px"
    />
    <ul id="songList"></ul>

    <h3 id="nowPlaying">Nothing playing</h3>

    <button onclick="playSong()">▶️ Play</button>
    <button onclick="pauseSong()">⏸️ Pause</button>

    <button onclick="prevSong()">⏮️ Previous</button>
    <button onclick="nextSong()">⏭️ Next</button>

    <br /><br />

    <audio id="player"></audio>
    <script src="script.js"></script>
  </body>
</html>
